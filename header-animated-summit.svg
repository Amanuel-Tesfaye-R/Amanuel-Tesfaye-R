<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
  <defs>
    <!-- Mist gradient for rolling fog bands -->
    <linearGradient id="cloudMist" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Star pulse glow -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Embed base rasterized high-contrast ink artwork -->
  <image href="header-bw-summit.png" width="1400" height="460" />

  <!-- ================= ANIMATED DRIFTING MIST & CLOUDS OVER SUMMIT ================= -->
  <!-- Rolling Mist Layer 1 (Drifts slowly across the cloud sea) -->
  <rect x="-400" y="240" width="1200" height="90" fill="url(#cloudMist)">
    <animate attributeName="x" values="-400;600;-400" dur="20s" repeatCount="indefinite" />
  </rect>

  <!-- Rolling Mist Layer 2 (Opposite drift in lower valley) -->
  <rect x="400" y="320" width="1200" height="110" fill="url(#cloudMist)">
    <animate attributeName="x" values="400;-200;400" dur="26s" repeatCount="indefinite" />
  </rect>

  <!-- ================= DRIFTING ALPINE SPINDRIFT PARTICLES ================= -->
  <!-- Falling & swaying wind-blown snow embers across the summit -->
  <g fill="#FFFFFF">
    <circle cx="480" r="1.4"><animate attributeName="cy" values="10;450" dur="3.8s" repeatCount="indefinite" /><animate attributeName="cx" values="480;560" dur="3.8s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.75;0" dur="3.8s" repeatCount="indefinite" /></circle>
    <circle cx="650" r="1.8"><animate attributeName="cy" values="20;450" dur="2.9s" begin="0.8s" repeatCount="indefinite" /><animate attributeName="cx" values="650;730" dur="2.9s" begin="0.8s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.85;0" dur="2.9s" begin="0.8s" repeatCount="indefinite" /></circle>
    <circle cx="820" r="1.2"><animate attributeName="cy" values="5;450" dur="4.2s" begin="1.6s" repeatCount="indefinite" /><animate attributeName="cx" values="820;900" dur="4.2s" begin="1.6s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.6;0" dur="4.2s" begin="1.6s" repeatCount="indefinite" /></circle>
    <circle cx="1020" r="2.0"><animate attributeName="cy" values="15;450" dur="3.2s" begin="0.4s" repeatCount="indefinite" /><animate attributeName="cx" values="1020;1100" dur="3.2s" begin="0.4s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.9;0" dur="3.2s" begin="0.4s" repeatCount="indefinite" /></circle>
    <circle cx="1200" r="1.5"><animate attributeName="cy" values="25;450" dur="3.6s" begin="2.1s" repeatCount="indefinite" /><animate attributeName="cx" values="1200;1280" dur="3.6s" begin="2.1s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="2.1s" repeatCount="indefinite" /></circle>
    <circle cx="1320" r="1.1"><animate attributeName="cy" values="10;450" dur="4.8s" begin="1.1s" repeatCount="indefinite" /><animate attributeName="cx" values="1320;1380" dur="4.8s" begin="1.1s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.5;0" dur="4.8s" begin="1.1s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Pulsing Summit Zenith Star in the night sky -->
  <circle cx="700" cy="55" r="1.5" fill="#FFFFFF" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
  </circle>

  <!-- Clean Border Outline -->
  <rect x="0.5" y="0.5" width="1399" height="459" fill="none" stroke="#30363D" stroke-width="1" rx="8" />
</svg>
