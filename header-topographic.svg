<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
  <defs>
    <!-- Glacial mist linear gradient -->
    <linearGradient id="frostBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B949E" stop-opacity="0" />
      <stop offset="30%" stop-color="#C9D1D9" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="70%" stop-color="#C9D1D9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8B949E" stop-opacity="0" />
    </linearGradient>

    <!-- Deep mountain ambient glow -->
    <radialGradient id="topoGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1F2A38" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0E131A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090D12" stop-opacity="0" />
    </radialGradient>

    <!-- Surveyor grid pattern -->
    <pattern id="surveyGrid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161F2B" stroke-width="0.8" opacity="0.6" />
      <circle cx="0" cy="0" r="1" fill="#2D3A4B" />
    </pattern>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="1400" height="460" fill="#090D12" rx="14" />
  <rect width="1400" height="460" fill="url(#surveyGrid)" />
  <rect x="150" y="30" width="1100" height="400" fill="url(#topoGlow)" />

  <!-- ================= TOPOGRAPHIC CONTOUR LINES (MOUNTAIN TOPOLOGY) ================= -->
  <!-- Outer contour ring (3200m) -->
  <path d="M 60 230 C 180 140, 320 80, 520 70 C 720 60, 940 85, 1140 130 C 1280 160, 1360 210, 1340 280 C 1320 350, 1200 400, 1020 415 C 820 430, 600 425, 420 395 C 240 365, 120 340, 60 280 Z"
        fill="none" stroke="#1C2735" stroke-width="1.4" opacity="0.8">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Secondary contour ring (3600m) -->
  <path d="M 120 235 C 220 160, 360 110, 540 100 C 730 90, 910 110, 1080 155 C 1220 190, 1280 240, 1260 300 C 1230 360, 1120 385, 960 395 C 780 405, 590 395, 430 370 C 270 345, 170 310, 120 235 Z"
        fill="none" stroke="#263548" stroke-width="1.2" opacity="0.85" />

  <!-- Mid contour ring (4000m - Index Contour) -->
  <path d="M 200 240 C 300 180, 420 135, 580 128 C 740 120, 880 135, 1010 175 C 1140 215, 1190 260, 1170 305 C 1140 355, 1030 370, 890 375 C 740 380, 580 370, 440 345 C 310 320, 230 290, 200 240 Z"
        fill="none" stroke="#374B63" stroke-width="1.8" opacity="0.75" />

  <!-- Inner contour ring (4300m) -->
  <path d="M 290 245 C 380 200, 480 165, 620 160 C 760 155, 870 170, 960 205 C 1050 240, 1090 275, 1070 310 C 1040 345, 940 355, 830 355 C 700 355, 570 345, 460 325 C 360 305, 310 280, 290 245 Z"
        fill="none" stroke="#48607E" stroke-width="1.2" opacity="0.6" />

  <!-- Summit crest ridge line (4550m Peak) -->
  <path d="M 400 250 C 480 220, 560 195, 680 192 C 800 190, 890 205, 930 235 C 970 265, 960 295, 890 315 C 800 330, 690 330, 590 320 C 490 310, 430 280, 400 250 Z"
        fill="none" stroke="#5F7B9E" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.65">
    <animate attributeName="stroke-dashoffset" values="0;40" dur="12s" repeatCount="indefinite" />
  </path>

  <!-- Elevation Callout Badges along contours -->
  <text x="215" y="195" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9" fill="#5F7B9E" letter-spacing="1">ELEV 3,600M</text>
  <text x="1110" y="200" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9" fill="#5F7B9E" letter-spacing="1">ELEV 4,000M [INDEX]</text>
  <text x="1005" y="340" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="9" fill="#5F7B9E" letter-spacing="1">ELEV 4,300M</text>

  <!-- ================= DRIFTING ALPINE SNOW PARTICLES ================= -->
  <!-- Diagonal high-altitude spindrift -->
  <g fill="#E6EDF3">
    <circle cx="150" r="1.3"><animate attributeName="cy" values="20;440" dur="4.2s" repeatCount="indefinite" /><animate attributeName="cx" values="150;230" dur="4.2s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="4.2s" repeatCount="indefinite" /></circle>
    <circle cx="380" r="1.6"><animate attributeName="cy" values="10;440" dur="3.5s" begin="0.8s" repeatCount="indefinite" /><animate attributeName="cx" values="380;460" dur="3.5s" begin="0.8s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.8;0" dur="3.5s" begin="0.8s" repeatCount="indefinite" /></circle>
    <circle cx="620" r="1.1"><animate attributeName="cy" values="30;440" dur="5.0s" begin="1.5s" repeatCount="indefinite" /><animate attributeName="cx" values="620;700" dur="5.0s" begin="1.5s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.5;0" dur="5.0s" begin="1.5s" repeatCount="indefinite" /></circle>
    <circle cx="910" r="1.8"><animate attributeName="cy" values="15;440" dur="3.8s" begin="0.3s" repeatCount="indefinite" /><animate attributeName="cx" values="910;990" dur="3.8s" begin="0.3s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.85;0" dur="3.8s" begin="0.3s" repeatCount="indefinite" /></circle>
    <circle cx="1180" r="1.4"><animate attributeName="cy" values="25;440" dur="4.5s" begin="2.1s" repeatCount="indefinite" /><animate attributeName="cx" values="1180;1260" dur="4.5s" begin="2.1s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.65;0" dur="4.5s" begin="2.1s" repeatCount="indefinite" /></circle>
  </g>

  <!-- ================= EXPEDITION HUD & BORDER FRAME ================= -->
  <!-- Top Surveyor Telemetry Bar -->
  <line x1="50" y1="45" x2="1350" y2="45" stroke="#212A36" stroke-width="1" />
  <text x="60" y="34" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" fill="#8B949E" letter-spacing="3">
    [ TOPOGRAPHIC SURVEY // HIGHLAND EXPEDITION ]
  </text>
  <text x="1340" y="34" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" fill="#C9D1D9" text-anchor="end" letter-spacing="3">
    SUMMIT DATUM: <tspan fill="#F0F6FC" font-weight="700">4,550M</tspan> · 09°01'N 038°44'E
  </text>

  <!-- Surveyor Crosshair corner marks -->
  <path d="M 40 55 L 40 40 L 55 40" fill="none" stroke="#48596D" stroke-width="1.8" />
  <path d="M 1360 55 L 1360 40 L 1345 40" fill="none" stroke="#48596D" stroke-width="1.8" />
  <path d="M 40 405 L 40 420 L 55 420" fill="none" stroke="#48596D" stroke-width="1.8" />
  <path d="M 1360 405 L 1360 420 L 1345 420" fill="none" stroke="#48596D" stroke-width="1.8" />

  <!-- ================= TYPOGRAPHY & IDENTITY ================= -->
  <text x="700" y="165" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="80" font-weight="800" fill="#F0F6FC" text-anchor="middle" letter-spacing="12">
    AMANUEL
  </text>
  <text x="700" y="228" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="64" font-weight="300" fill="#8B949E" text-anchor="middle" letter-spacing="10">
    TESFAYE
  </text>

  <!-- Frost Divider Beam -->
  <line x1="500" y1="256" x2="900" y2="256" stroke="url(#frostBeam)" stroke-width="1.8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </line>

  <!-- Tagline with subtle breathing dot -->
  <g transform="translate(700, 298)">
    <circle cx="-165" cy="-5" r="3" fill="#8B949E">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="0" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="19" font-weight="500" fill="#C9D1D9" text-anchor="middle" letter-spacing="6">
      building at the intersection
    </text>
    <circle cx="165" cy="-5" r="3" fill="#8B949E">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtitle Pillars -->
  <text x="700" y="345" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="14" font-weight="500" fill="#6E7681" text-anchor="middle" letter-spacing="6">
    BUSINESS ADMINISTRATION  ·  SYSTEMS ARCHITECTURE  ·  AUTONOMOUS AGENTS
  </text>

  <!-- Bottom elevation scale gauge -->
  <line x1="300" y1="410" x2="1100" y2="410" stroke="#1C2735" stroke-width="1" />
  <line x1="300" y1="405" x2="300" y2="415" stroke="#374B63" stroke-width="1.5" />
  <line x1="500" y1="407" x2="500" y2="413" stroke="#263548" stroke-width="1" />
  <line x1="700" y1="405" x2="700" y2="415" stroke="#374B63" stroke-width="1.5" />
  <line x1="900" y1="407" x2="900" y2="413" stroke="#263548" stroke-width="1" />
  <line x1="1100" y1="405" x2="1100" y2="415" stroke="#374B63" stroke-width="1.5" />

  <text x="700" y="432" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" fill="#48596D" text-anchor="middle" letter-spacing="4">
    SURVEY DATUM: SIMIEN MASSIF // ADDIS ABABA, ETHIOPIA
  </text>
</svg>
