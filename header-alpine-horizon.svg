<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
  <defs>
    <!-- Alpine Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05080C" />
      <stop offset="60%" stop-color="#090E14" />
      <stop offset="100%" stop-color="#0D131A" />
    </linearGradient>

    <!-- Rolling fog layer gradients -->
    <linearGradient id="fogGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B949E" stop-opacity="0" />
      <stop offset="25%" stop-color="#C9D1D9" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#F0F6FC" stop-opacity="0.12" />
      <stop offset="75%" stop-color="#C9D1D9" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#8B949E" stop-opacity="0" />
    </linearGradient>

    <!-- Frost line gradient -->
    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30363D" stop-opacity="0" />
      <stop offset="50%" stop-color="#8B949E" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#30363D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Alpine Night Canvas -->
  <rect width="1400" height="460" fill="url(#nightSky)" rx="14" />

  <!-- ================= CELESTIAL ALPINE NIGHT SKY ================= -->
  <!-- Crisp high-altitude stars -->
  <g fill="#F0F6FC">
    <circle cx="85" cy="50" r="1.1"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="190" cy="75" r="0.8"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.1s" begin="1.2s" repeatCount="indefinite" /></circle>
    <circle cx="310" cy="35" r="1.3"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.8s" begin="0.5s" repeatCount="indefinite" /></circle>
    <circle cx="440" cy="80" r="0.9"><animate attributeName="opacity" values="0.4;1.0;0.4" dur="3.5s" begin="2.0s" repeatCount="indefinite" /></circle>
    <circle cx="610" cy="45" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.5s" begin="0.8s" repeatCount="indefinite" /></circle>
    <circle cx="790" cy="30" r="1.0"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.0s" begin="1.7s" repeatCount="indefinite" /></circle>
    <circle cx="960" cy="65" r="1.4"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.9s" begin="0.3s" repeatCount="indefinite" /></circle>
    <circle cx="1090" cy="40" r="0.8"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.6s" begin="2.3s" repeatCount="indefinite" /></circle>
    <circle cx="1220" cy="70" r="1.2"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.2s" begin="1.0s" repeatCount="indefinite" /></circle>
    <circle cx="1330" cy="35" r="1.0"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.3s" begin="1.5s" repeatCount="indefinite" /></circle>
  </g>

  <!-- ================= MOUNTAIN SILHOUETTE RANGES ================= -->
  <!-- Layer 1: Distant Massive Ridge (Deep Charcoal #10161E) -->
  <path d="M 0 460 L 0 340 L 95 315 L 180 335 L 290 285 L 390 320 L 510 260 L 610 305 L 700 240 L 810 295 L 930 250 L 1050 310 L 1170 270 L 1280 325 L 1400 290 L 1400 460 Z"
        fill="#10161E" opacity="0.8" />

  <!-- Layer 2: Mid-Range Peaks (#161F2A) with highlighted crest lines -->
  <path d="M 0 460 L 0 375 L 70 350 L 160 380 L 260 330 L 370 365 L 480 310 L 580 345 L 680 290 L 780 340 L 890 295 L 1000 350 L 1120 305 L 1230 355 L 1330 320 L 1400 340 L 1400 460 Z"
        fill="#161F2A" />
  
  <!-- Snow crest highlight on mid peaks -->
  <path d="M 0 375 L 70 350 L 160 380 L 260 330 L 370 365 L 480 310 L 580 345 L 680 290 L 780 340 L 890 295 L 1000 350 L 1120 305 L 1230 355 L 1330 320 L 1400 340"
        fill="none" stroke="#2D3B4C" stroke-width="1.2" />

  <!-- Layer 3: Foreground Sharp Ridgeline (#1E2836) -->
  <path d="M 0 460 L 0 405 L 110 385 L 210 415 L 340 370 L 450 405 L 560 355 L 670 395 L 780 345 L 890 390 L 1010 350 L 1130 400 L 1260 365 L 1370 400 L 1400 390 L 1400 460 Z"
        fill="#1C2634" />
  <path d="M 0 405 L 110 385 L 210 415 L 340 370 L 450 405 L 560 355 L 670 395 L 780 345 L 890 390 L 1010 350 L 1130 400 L 1260 365 L 1370 400 L 1400 390"
        fill="none" stroke="#485B70" stroke-width="1.4" />

  <!-- ================= ROLLING ALPINE FOG & MIST BANDS ================= -->
  <!-- Fog Band 1 (Slow drift across lower valley) -->
  <g opacity="0.65">
    <rect x="-300" y="360" width="1000" height="45" fill="url(#fogGrad)">
      <animate attributeName="x" values="-300;700;-300" dur="24s" repeatCount="indefinite" />
    </rect>
    <rect x="500" y="380" width="1000" height="40" fill="url(#fogGrad)">
      <animate attributeName="x" values="500;-300;500" dur="28s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- ================= TYPOGRAPHY & IDENTITY ================= -->
  <!-- Top Altitude Bar -->
  <line x1="60" y1="42" x2="1340" y2="42" stroke="#212A35" stroke-width="1" />
  <text x="60" y="32" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" fill="#8B949E" letter-spacing="3">
    [ ALPINE SUMMIT SURVEY // ETHIOPIAN HIGHLANDS ]
  </text>
  <text x="1340" y="32" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" fill="#C9D1D9" text-anchor="end" letter-spacing="3">
    PEAK ELEVATION: <tspan fill="#F0F6FC" font-weight="700">4,550M</tspan> · LAT: 09°01'N  LON: 038°44'E
  </text>

  <!-- Primary Name -->
  <text x="700" y="145" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="78" font-weight="800" fill="#F0F6FC" text-anchor="middle" letter-spacing="12">
    AMANUEL
  </text>
  <text x="700" y="205" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="62" font-weight="300" fill="#8B949E" text-anchor="middle" letter-spacing="10">
    TESFAYE
  </text>

  <!-- Alpine Ridge Frost Line -->
  <line x1="520" y1="230" x2="880" y2="230" stroke="url(#crestGlow)" stroke-width="1.6" />

  <!-- Monospace Tagline -->
  <text x="700" y="270" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="18.5" font-weight="500" fill="#C9D1D9" text-anchor="middle" letter-spacing="6">
    building at the intersection
  </text>

  <!-- Subtitle Pillars -->
  <text x="700" y="308" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="13" font-weight="500" fill="#6E7681" text-anchor="middle" letter-spacing="5">
    BUSINESS ADMINISTRATION  ·  SYSTEMS ARCHITECTURE  ·  AUTONOMOUS AGENTS
  </text>

  <!-- Minimalist Ridge Coordinates -->
  <text x="700" y="442" font-family="'SF Mono', 'Fira Code', 'Consolas', monospace" font-size="10.5" fill="#485B70" text-anchor="middle" letter-spacing="4">
    STUBBORN ARCHITECTURE // ZERO COMPROMISE // ADDIS ABABA, ETHIOPIA
  </text>
</svg>
