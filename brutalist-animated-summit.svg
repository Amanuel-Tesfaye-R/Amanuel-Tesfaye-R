<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460">
  <defs>
    <!-- Rolling mist layer gradient -->
    <linearGradient id="mistBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Star pulse glow -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Embed brutalist-summit-ravens.png as the high-res base -->
  <image href="brutalist-summit-ravens.png" width="1400" height="460" />

  <!-- ================= ANIMATED DRIFTING MIST & SPINDRIFT ================= -->
  <!-- Layer 1: Atmospheric rolling cloud bank across the mid-ground -->
  <rect x="-400" y="270" width="1200" height="95" fill="url(#mistBand)">
    <animate attributeName="x" values="-400;600;-400" dur="22s" repeatCount="indefinite" />
  </rect>

  <!-- Layer 2: Lower valley counter-drift -->
  <rect x="500" y="340" width="1200" height="100" fill="url(#mistBand)">
    <animate attributeName="x" values="500;-300;500" dur="28s" repeatCount="indefinite" />
  </rect>

  <!-- Drifting wind-blown snow spindrift -->
  <g fill="#FFFFFF">
    <circle cx="200" r="1.3"><animate attributeName="cy" values="10;450" dur="3.6s" repeatCount="indefinite" /><animate attributeName="cx" values="200;280" dur="3.6s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.7;0" dur="3.6s" repeatCount="indefinite" /></circle>
    <circle cx="450" r="1.7"><animate attributeName="cy" values="15;450" dur="2.8s" begin="0.7s" repeatCount="indefinite" /><animate attributeName="cx" values="450;530" dur="2.8s" begin="0.7s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.85;0" dur="2.8s" begin="0.7s" repeatCount="indefinite" /></circle>
    <circle cx="700" r="1.1"><animate attributeName="cy" values="5;450" dur="4.1s" begin="1.4s" repeatCount="indefinite" /><animate attributeName="cx" values="700;780" dur="4.1s" begin="1.4s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.6;0" dur="4.1s" begin="1.4s" repeatCount="indefinite" /></circle>
    <circle cx="950" r="1.9"><animate attributeName="cy" values="20;450" dur="3.1s" begin="0.3s" repeatCount="indefinite" /><animate attributeName="cx" values="950;1030" dur="3.1s" begin="0.3s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.9;0" dur="3.1s" begin="0.3s" repeatCount="indefinite" /></circle>
    <circle cx="1200" r="1.4"><animate attributeName="cy" values="25;450" dur="3.9s" begin="1.9s" repeatCount="indefinite" /><animate attributeName="cx" values="1200;1280" dur="3.9s" begin="1.9s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.75;0" dur="3.9s" begin="1.9s" repeatCount="indefinite" /></circle>
  </g>

  <!-- Soaring Raven Path (A subtle silhouette raven gliding in the upper wind) -->
  <g fill="#0A0E14" opacity="0.85">
    <path d="M 0 0 C 15 -8, 30 -5, 45 -12 C 35 2, 25 8, 15 5 C 5 10, -10 5, -25 0 Z">
      <animateMotion path="M -50 80 L 1450 65" dur="18s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="scale" values="0.8;0.85;0.8" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Minimalist frame outline -->
  <rect x="0.5" y="0.5" width="1399" height="459" fill="none" stroke="#30363D" stroke-width="1" rx="8" />
</svg>
